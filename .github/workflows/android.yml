name: Build Benja Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Benja_Eclipse_Escarlate_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project
        run: |
          unzip -q Benja_Eclipse_Escarlate_Android_Project.zip -d project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project/Benja_Eclipse_Escarlate_Android" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Benja-Eclipse-Escarlate-debug-apk
          path: project/Benja_Eclipse_Escarlate_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
